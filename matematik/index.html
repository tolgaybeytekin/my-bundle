<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matematik Test Uretici | Online Soru ve Test Hazirlama</title>
  <meta name="description" content="Seviye, zorluk ve konu secerek hizlica matematik testleri olusturun, cevap anahtarini gorun ve pratik yapin." />
  <meta name="keywords" content="matematik test uretici, online matematik testi, lgs matematik testi, tyt matematik sorulari, test hazirlama" />
  <meta name="author" content="Matematik Test Uretici" />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="tr_TR" />
  <meta property="og:title" content="Matematik Test Uretici" />
  <meta property="og:description" content="Konu ve zorluk secerek online matematik testi olusturun." />
  <meta name="twitter:card" content="summary_large_image" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Matematik Test Uretici",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Web",
    "inLanguage": "tr"
  }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 28px 16px 60px; }
    .wrap { max-width: 820px; margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    h1 { margin: 0; color: #38bdf8; font-size: 1.75rem; }
    a.btn, button { border: none; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.92rem; }
    .btn-ghost { background: #1e293b; color: #e2e8f0; }
    .btn-primary { background: #2563eb; color: #fff; }
    .panel { background: #111827; border: 1px solid #1e293b; border-radius: 14px; padding: 20px; margin-bottom: 20px; }
    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
    select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0b1120; color: #fff; }
    .q-card { background: #111827; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    @media (max-width: 560px) { .opts { grid-template-columns: 1fr; } }
    .opt { text-align: left; background: #0f172a; color: #e2e8f0; border: 1px solid #334155; }
    .opt.correct { border-color: #22c55e; background: rgba(34, 197, 94, 0.14); }
    .opt.wrong { border-color: #ef4444; background: rgba(239, 68, 68, 0.14); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Matematik Test Uretici</h1>
      <a class="btn btn-ghost" href="../">Ana Sayfa</a>
    </div>
    <div class="panel">
      <div class="controls">
        <div>
          <label for="topicSelect">Konu</label>
          <select id="topicSelect">
            <option value="all">Tum Konular</option>
            <option value="carpanlar">Carpanlar ve Katlar</option>
            <option value="uslu">Uslu Ifadeler</option>
            <option value="oran">Oran - Oranti ve Yuzde</option>
          </select>
        </div>
        <div>
          <label for="countSelect">Soru Sayisi</label>
          <select id="countSelect">
            <option value="3">3 Soru</option>
            <option value="5" selected>5 Soru</option>
          </select>
        </div>
      </div>
      <button type="button" class="btn-primary" id="genBtn">Test Olustur</button>
    </div>
    <div id="quizArea"></div>
  </div>
  <script>
    const bank = [
      { topic: "carpanlar", q: "12 ve 18 sayilarinin EBOB'u kactir?", opts: ["3", "6", "9", "36"], ans: 1 },
      { topic: "carpanlar", q: "8 ve 12 sayilarinin EKOK'u kactir?", opts: ["12", "16", "24", "48"], ans: 2 },
      { topic: "uslu", q: "2^4 + 2^3 isleminin sonucu kactir?", opts: ["12", "16", "24", "32"], ans: 2 },
      { topic: "uslu", q: "5^2 . 5^1 isleminin sonucu kactir?", opts: ["25", "75", "125", "15"], ans: 2 },
      { topic: "oran", q: "200 sayisinin %15'i kactir?", opts: ["20", "25", "30", "35"], ans: 2 }
    ];
    function generateTest() {
      const topic = document.getElementById("topicSelect").value;
      const count = Number(document.getElementById("countSelect").value);
      let pool = topic === "all" ? [...bank] : bank.filter(x => x.topic === topic);
      if (pool.length === 0) pool = [...bank];
      const picked = pool.sort(() => Math.random() - 0.5).slice(0, Math.min(count, pool.length));
      const area = document.getElementById("quizArea");
      area.innerHTML = picked.map((item, i) => `
        <div class="q-card">
          <div><strong>${i + 1}.</strong> ${item.q}</div>
          <div class="opts">
            ${item.opts.map((o, idx) => `<button type="button" class="opt" onclick="checkAns(this, ${idx === item.ans}, this.parentElement)">${String.fromCharCode(65+idx)}) ${o}</button>`).join("")}
          </div>
        </div>
      `).join("");
    }
    window.checkAns = function(btn, isCorrect, parent) {
      [...parent.children].forEach(b => b.disabled = true);
      btn.classList.add(isCorrect ? "correct" : "wrong");
    };
    document.getElementById("genBtn").addEventListener("click", generateTest);
    generateTest();
  </script>
</body>
</html>
